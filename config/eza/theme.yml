# Rose Pine Moon for eza
# base #232136  surface #2a273f  overlay #393552
# muted #6e6a86 subtle #908caa   text #e0def4
# love #eb6f92  gold #f6c177     rose #ea9a97
# pine #3e8fb0  foam #9ccfd8     iris #c4a7e7

filekinds:
  normal: { foreground: "#e0def4" }
  directory: { foreground: "#c4a7e7", is_bold: true }
  symlink: { foreground: "#9ccfd8" }
  pipe: { foreground: "#6e6a86" }
  block_device: { foreground: "#eb6f92" }
  char_device: { foreground: "#eb6f92" }
  socket: { foreground: "#6e6a86" }
  special: { foreground: "#c4a7e7" }
  executable: { foreground: "#3e8fb0", is_bold: true }
  mount_point: { foreground: "#9ccfd8" }

perms:
  user_read: { foreground: "#e0def4" }
  user_write: { foreground: "#f6c177" }
  user_execute_file: { foreground: "#3e8fb0" }
  user_execute_other: { foreground: "#3e8fb0" }
  group_read: { foreground: "#908caa" }
  group_write: { foreground: "#f6c177" }
  group_execute: { foreground: "#3e8fb0" }
  other_read: { foreground: "#908caa" }
  other_write: { foreground: "#f6c177" }
  other_execute: { foreground: "#3e8fb0" }
  special_user_file: { foreground: "#c4a7e7" }
  special_other: { foreground: "#6e6a86" }
  attribute: { foreground: "#6e6a86" }

size:
  major: { foreground: "#9ccfd8" }
  minor: { foreground: "#3e8fb0" }
  number_byte: { foreground: "#e0def4" }
  number_kilo: { foreground: "#e0def4" }
  number_mega: { foreground: "#9ccfd8" }
  number_giga: { foreground: "#c4a7e7" }
  number_huge: { foreground: "#eb6f92" }
  unit_byte: { foreground: "#908caa" }
  unit_kilo: { foreground: "#908caa" }
  unit_mega: { foreground: "#9ccfd8" }
  unit_giga: { foreground: "#c4a7e7" }
  unit_huge: { foreground: "#eb6f92" }

users:
  user_you: { foreground: "#e0def4" }
  user_root: { foreground: "#eb6f92" }
  user_other: { foreground: "#908caa" }
  group_yours: { foreground: "#908caa" }
  group_root: { foreground: "#eb6f92" }
  group_other: { foreground: "#6e6a86" }

links:
  normal: { foreground: "#9ccfd8" }
  multi_link_file: { foreground: "#f6c177" }

git:
  new: { foreground: "#9ccfd8" }
  modified: { foreground: "#f6c177" }
  deleted: { foreground: "#eb6f92" }
  renamed: { foreground: "#c4a7e7" }
  typechange: { foreground: "#ea9a97" }
  ignored: { foreground: "#6e6a86" }
  conflicted: { foreground: "#eb6f92" }

git_repo:
  branch_main: { foreground: "#e0def4" }
  branch_other: { foreground: "#c4a7e7" }
  git_clean: { foreground: "#9ccfd8" }
  git_dirty: { foreground: "#f6c177" }

security_context:
  colon: { foreground: "#6e6a86" }
  user: { foreground: "#908caa" }
  role: { foreground: "#c4a7e7" }
  typ: { foreground: "#6e6a86" }
  range: { foreground: "#c4a7e7" }

punctuation: { foreground: "#6e6a86" }
date: { foreground: "#f6c177" }
inode: { foreground: "#908caa" }
blocks: { foreground: "#908caa" }
header: { foreground: "#e0def4", is_bold: true }
octal: { foreground: "#9ccfd8" }
flags: { foreground: "#c4a7e7" }
symlink_path: { foreground: "#9ccfd8" }
control_char: { foreground: "#3e8fb0" }
broken_symlink: { foreground: "#eb6f92" }
broken_path_overlay: { foreground: "#6e6a86" }
