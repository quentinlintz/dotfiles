# tmux.
#
# The window manager for terminal work: Neovim in one pane, Claude Code in
# another, tests in a third. The reason it is tmux and not Ghostty splits is
# detach: a Claude Code run outlives the terminal window it started in.
#
# No tpm. The status line below is hand-rolled for the same reason the rest of
# these dotfiles have no framework.
#
#   prefix C-b    which-key C-b Space    cheat sheet C-b ?    reload C-b r

# ─── keys ─────────────────────────────────────────────────────────────────────
# Default prefix, kept on purpose: it is the one already in muscle memory.
# The cost is that C-b no longer reaches Neovim as page-up; C-u / C-d and
# <C-f> cover the same ground. Press C-b twice to send a literal one through.
set -g prefix C-b
bind C-b send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display -d 1000 "reloaded"

# ─── behavior ─────────────────────────────────────────────────────────────────
# Without this, <Esc> in Neovim waits for an escape sequence that is not coming
# and normal mode arrives visibly late.
set -sg escape-time 0

# Makes nvim's FocusGained fire, which is what triggers :checktime, which is
# what reloads a file Claude Code rewrote in the pane next door. Load-bearing.
set -g focus-events on

# Claude Code, running in the pane next door, needs all three. Without
# allow-passthrough its desktop notifications and progress bar are swallowed by
# tmux instead of reaching Ghostty; without the extended-keys pair tmux cannot
# tell Shift+Enter from Enter, so a newline submits the prompt instead.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000        # long agent transcripts are worth scrolling
set -g display-time 2000
set -g set-clipboard on
setw -g mode-keys vi

# Truecolor and undercurl. tmux advertises tmux-256color to programs inside it;
# the overrides describe what the outer terminal (Ghostty) can actually do.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-features ",xterm-ghostty:usstyle"

# ─── panes and windows ────────────────────────────────────────────────────────
# | and - look like the split they make. Both inherit the current directory,
# which the defaults do not.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r n next-window
bind -r p previous-window
bind Tab last-window            # Space is the which-key menu now

bind z resize-pane -Z          # zoom one pane to full window and back
bind x kill-pane
bind X kill-window

# vi-style visual selection in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ─── the workbench ────────────────────────────────────────────────────────────
# Panes are for things you watch; popups are for things you do. So a project
# window is always exactly these two panes and never grows a third. Tests,
# builds and one-off commands go in the C-b t popup and disappear again.
#
#   ┌──────────────────┬────────────┐
#   │       nvim       │   claude   │
#   └──────────────────┴────────────┘
# --ide is not optional: it is what makes claude look for the lock file Neovim
# wrote, which is what makes <leader>as in the left pane reach this one.
bind G split-window -h -l 35% -c "#{pane_current_path}" "claude --ide" \; \
       select-pane -t 1

# ─── popups ───────────────────────────────────────────────────────────────────
# Float over whatever is running, then vanish. Nothing to clean up, no layout
# drift. This is the half of the doctrine tmux is quietly good at.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "yazi"
bind t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"   # scratch shell
bind ? display-popup -E -w 80% -h 80% "~/.local/bin/tm-cheat"
bind / list-keys                # what C-b ? used to do

# ─── agents ───────────────────────────────────────────────────────────────────
# One agent, one worktree, one window. The pane-mate claude is for the code in
# front of you; anything long-running gets its own checkout so the two can never
# fight over the same files. --worktree is Claude Code's own flag.
bind a command-prompt -p "agent:" \
     "new-window -n '%1' -c '#{pane_current_path}' 'claude --worktree %1'"
bind A display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "~/.local/bin/tm-worktrees"

# ─── which-key ────────────────────────────────────────────────────────────────
# Space is the leader everywhere: inside the file it is Neovim's, outside it you
# prefix it with C-b. Same instinct, one scope out. display-menu is native tmux,
# no tpm here either. Every entry mirrors a real binding above, so the menu
# teaches the keys rather than replacing them.
bind Space display-menu -T "#[align=centre fg=#c4a7e7,bold] tmux " -x C -y C \
  "lazygit"          g "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit" \
  "files"            y "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' yazi" \
  "scratch shell"    t "display-popup -E -w 80% -h 70% -d '#{pane_current_path}'" \
  "" \
  "new agent"        a "command-prompt -p 'agent:' \"new-window -n '%1' -c '#{pane_current_path}' 'claude --worktree %1'\"" \
  "worktrees"        A "display-popup -E -w 80% -h 70% -d '#{pane_current_path}' ~/.local/bin/tm-worktrees" \
  "sessions"         o "run-shell '~/.local/bin/tm-sessions'" \
  "" \
  "split right"      '|' "split-window -h -c '#{pane_current_path}'" \
  "split down"       '-' "split-window -v -c '#{pane_current_path}'" \
  "zoom pane"        z "resize-pane -Z" \
  "last window"      Tab "last-window" \
  "workbench"        G "split-window -h -l 35% -c '#{pane_current_path}' 'claude --ide' ; select-pane -t 1" \
  "" \
  "cheat sheet"      '?' "display-popup -E -w 80% -h 80% ~/.local/bin/tm-cheat" \
  "reload config"    r "source-file ~/.config/tmux/tmux.conf" \
  "detach"           d "detach-client"

# Session switcher in a popup over whatever is running. The picker itself lives
# in bin/tm-sessions so the C-b Space menu can call the same one.
bind o run-shell "~/.local/bin/tm-sessions"

# ─── status line ──────────────────────────────────────────────────────────────
# Rosé Pine Moon. base #232136  surface #2a273f  overlay #393552
# muted #6e6a86  subtle #908caa  text #e0def4  iris #c4a7e7  foam #9ccfd8
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#232136,fg=#908caa"

set -g status-left "#[bg=#232136,fg=#c4a7e7,bold] #S #[default]"
set -g status-left-length 30

# Right side stays nearly empty on purpose: starship already prints host, dir
# and git state inside the pane, and printing them twice is just noise.
set -g status-right "#[fg=#6e6a86]#{?client_prefix,#[fg=#eb6f92]prefix ,}%H:%M "
set -g status-right-length 40

setw -g window-status-format "#[fg=#6e6a86] #I #W "
setw -g window-status-current-format "#[fg=#9ccfd8,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#2a273f"
set -g pane-active-border-style "fg=#393552"
set -g message-style "bg=#2a273f,fg=#e0def4"
set -g mode-style "bg=#393552,fg=#e0def4"
